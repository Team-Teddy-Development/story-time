name: test
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: npm test
  cartographer-preflight:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test --locked --manifest-path tools/cartographer-preflight/Cargo.toml
      - run: cargo clippy --locked --manifest-path tools/cartographer-preflight/Cargo.toml --all-targets -- -D warnings
      - run: rustc --edition=2021 -D warnings --test tests/cartographer_setup.rs -o /tmp/story-time-cartographer-setup-tests
      - run: /tmp/story-time-cartographer-setup-tests --test-threads=1
  story-policy-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: |
          rustc --edition=2021 --test scripts/story-policy.rs -o /tmp/story-policy-tests
          /tmp/story-policy-tests
          rustc --edition=2021 --test test/story-policy-contract.rs -o /tmp/story-policy-contract
          /tmp/story-policy-contract
