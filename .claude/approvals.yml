# Claude Approvals policy: https://code.claude.com/docs/en/approvals-policy
# Observe mode: the "Claude Approvals" check reports what this policy would
# decide and does not block a merge. To enforce, delete the `mode` line, then
# require the "Claude Approvals" check (source: the Claude app) on the default
# branch. Setup steps: https://code.claude.com/docs/en/approvals-setup
version: 1
mode: observe
rules:
  - purpose: "A change takes two people."
    paths: ["**"]
    verdict: { claude: comments, seats: 2 }
    advisory: [claude/code_review]
  - purpose: "A change to the review rules takes two people."
    paths: ["**/.claude/**"]
    nested: inherit
    verdict: { claude: comments, seats: 2 }
